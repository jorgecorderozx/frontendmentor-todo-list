<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Todo app</title>
</head>

<body>

  <header class="flex">
    <h1>Todo</h1>
    <button type="button" class="theme-toggle">
      <img src="images/icon-moon.svg" alt="light/dark mode icon">
    </button>
  </header>

  <main class="flex flex-column">
    <form class="card-section flex">
      <div class="check"></div>
      <input type="text" placeholder="Create a new todo..." id="new-todo">
    </form>
    <div>
      <ul class="tasks-wrapper card-section">
      <!--<li class="flex"><button class="check"></button> <span>Test item<span> <button class="cross"></button></li>-->
      </ul>
      <section class="tasks-wrapper-info flex card-section">
        <p class="remaining-items">
           0 items left
        </p>
        <button type="button" class="clear">
          Clear Completed
        </button>
      </section>
    </div>

    <section class="categories-wrapper flex card-section">
      <button type="button" id="all-btn">All</button>
      <button type="button" id="active-btn">Active</button>
      <button type="button" id="completed-btn">Completed</button>
    </section>

    <footer>
      <p>Drag and drop to reorder list</p>
    </footer>
  </main>
  <script src="index.js"></script>
</body>

</html>
